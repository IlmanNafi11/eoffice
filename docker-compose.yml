services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kominfo-app
    working_dir: /app
    volumes:
      - .:/app
    environment:
      APP_ENV: local
      APP_DEBUG: "${APP_DEBUG:-false}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: kominfo_wfh
      DB_USERNAME: kominfo
      DB_PASSWORD: kominfo
    depends_on:
      postgres:
        condition: service_healthy
    stdin_open: true
    tty: true

  postgres:
    image: postgres:15
    container_name: kominfo-db
    environment:
      POSTGRES_DB: kominfo_wfh
      POSTGRES_USER: kominfo
      POSTGRES_PASSWORD: kominfo
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kominfo -d kominfo_wfh"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
