        "422":
          description: Report not editable (approved/pending) or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: "Laporan yang sudah disetujui tidak dapat diubah."
  /api/wfh/reports/{report}/activities/{activity}:
    put:
      tags: [WFH Reports]
      summary: Update one activity (links applied as id-diff)
      operationId: updateReportActivity
      description: |
        v6.0.0: updates one activity. Submitted `links` are applied as an
        id-diff — matched `id`s kept, new entries (no id) created, missing
        ids deleted. Same ownership/editability guards as POST.
        Requires `wfh.report.update`.
      parameters:
        - $ref: "#/components/parameters/ReportIdPath"
        - name: activity
          in: path
          required: true
          schema:
            type: integer
          description: Activity id; must belong to the parent report (else 404).
          example: 67
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreActivityRequest"
            example:
              activity: "Menyusun dokumentasi API modul WFH"
              start_time: "08:00"
              end_time: "11:00"
              links:
                - id: 89
                  url: "https://git.kominfo.go.id/intern/wfh-api/-/merge_requests/12"
                - url: "https://git.kominfo.go.id/intern/wfh-api/-/issues/34"
      responses:
        "200":
          description: Activity updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportActivityResponse"
              example:
                success: true
                message: Kegiatan berhasil diperbarui.
                data:
                  id: 67
                  activity: "Menyusun dokumentasi API modul WFH"
                  start_time: "08:00"
                  end_time: "11:00"
                  sort_order: 1
                  links:
                    - id: 89
                      url: "https://git.kominfo.go.id/intern/wfh-api/-/merge_requests/12"
                    - id: 90
                      url: "https://git.kominfo.go.id/intern/wfh-api/-/issues/34"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Unauthenticated.
        "403":
          description: Not the report owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: "Tidak dapat mengubah laporan orang lain."
        "404":
          description: Activity not found under this report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: "Kegiatan tidak ditemukan."
        "422":
          description: Report not editable or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: "Laporan yang sudah disetujui tidak dapat diubah."
    delete:
      tags: [WFH Reports]
      summary: Delete an activity (cascade-deletes its links)
      operationId: deleteReportActivity
      parameters:
        - $ref: "#/components/parameters/ReportIdPath"
        - name: activity
          in: path
          required: true
          schema:
            type: integer
          example: 67
      responses:
        "200":
          description: Activity deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                message: Kegiatan berhasil dihapus.
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Unauthenticated.
        "403":
          description: Not the report owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: "Tidak dapat mengubah laporan orang lain."
        "404":
          description: Activity not found under this report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: "Kegiatan tidak ditemukan."
        "422":
          description: Report not editable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: "Laporan yang sudah disetujui tidak dapat diubah."
  /api/wfh/reports/{report}/activities/reorder:
    patch:
      tags: [WFH Reports]
      summary: Reorder activities for a report
      operationId: reorderReportActivities
      description: |
        Rewrites `sort_order` to match the given id sequence. The `ids` array
        must contain exactly the report's activity ids (no extras, none
        missing), else 422. Ownership/editability guards apply.
      parameters:
        - $ref: "#/components/parameters/ReportIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
