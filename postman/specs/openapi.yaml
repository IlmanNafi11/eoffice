              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidPermission:
                  summary: Permission name does not exist
                  value:
                    success: false
                    message: "The selected permissions.1 is invalid."
                lockoutPrevention:
                  summary: Cannot strip critical permissions from admin
                  value:
                    success: false
                    message: "Role 'admin' tidak boleh kehilangan permission kritis: role.manage, permission.manage, user.manage."
  /api/admin/permissions:
    get:
      tags: [RBAC Management]
      summary: List all available permissions
      operationId: listPermissions
      security:
        - bearerAuth: []
      description: |
        Returns all registered permissions in the system.
        Requires `permission.manage` permission.
      responses:
        "200":
          description: Permission list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionListResponse"
        "403":
          description: Missing permission.manage permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Teams (dropdown) ─────────────────────────────────────────────
  /api/teams:
    get:
      tags: [Organization]
      summary: List teams for dropdown selection
      operationId: listTeams
      security:
        - bearerAuth: []
      description: |
        Returns a flat list of teams, optionally filtered by bidang (field).
        Use this endpoint to populate `<select>` dropdowns in admin/staf
        forms so users pick from options instead of typing team IDs.

        Visible to any authenticated user (no permission gate).
        Soft-deleted teams are excluded automatically.
      parameters:
        - name: field_id
          in: query
          description: Optional bidang filter. Only teams in this field are returned.
          required: false
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Team list (empty array if no teams match)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamListResponse"
              examples:
                allTeams:
                  summary: All teams (no filter)
                  value:
                    success: true
                    data:
                      - id: 3
                        name: Tim Aplikasi Informatika
                        leader_id: 12
                        field_id: 1
                      - id: 4
                        name: Tim Jaringan dan Infrastruktur
                        leader_id: 18
                        field_id: 2
                      - id: 5
                        name: Tim Keamanan Siber
                        leader_id: 9
                        field_id: 1
                filteredByField:
                  summary: Filtered by field_id=1 (Bidang Aplikasi Informatika)
                  value:
                    success: true
                    data:
                      - id: 3
                        name: Tim Aplikasi Informatika
                        leader_id: 12
                        field_id: 1
                      - id: 5
                        name: Tim Keamanan Siber
                        leader_id: 9
                        field_id: 1
                empty:
                  summary: No teams found
                  value:
                    success: true
                    data: []
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Unauthenticated.

  # ── Settings ──────────────────────────────────────────────────────
  /api/admin/settings:
    get:
      tags: [Settings]
      summary: List all settings as a key→value map
      operationId: listSettings
      security:
        - bearerAuth: []
      description: |
        Returns every setting as a flat `{ key: value }` object. Values are
        JSON-decoded when possible (numbers, booleans, arrays). Requires the
        `setting.manage` permission.
      responses:
        "200":
          description: Settings map
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: true
                    description: Arbitrary key→value pairs.
                    example:
                      password_default_admin: "admin123"
                      password_default_user: "user1234"
                      wfh_allowed_days: [1, 2, 3, 4, 5]
                      wfh_sessions: ["pagi", "siang", "sore"]
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Unauthenticated.
        "403":
          description: Missing setting.manage permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: This action is unauthorized.
  /api/admin/settings/{key}:
    put:
      tags: [Settings]
      summary: Update a single setting value
      operationId: updateSetting
      security:
        - bearerAuth: []
      description: |
        Updates the value of an existing setting identified by `key`. Requires
        the `setting.manage` permission.
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: Setting key (must already exist).
          example: password_default_user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingRequest"
      responses:
        "200":
          description: Setting updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [key, value]
                    properties:
                      key:
                        type: string
                        example: password_default_user
                      value:
                        description: Updated value (decoded if JSON-encodable).
                        example: "BaruUser123!"
              example:
                data:
                  key: password_default_user
                  value: "BaruUser123!"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Unauthenticated.
        "403":
          description: Missing setting.manage permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: This action is unauthorized.
        "422":
          description: Setting key not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "Setting 'unknown_key' tidak ditemukan."
  # ── WFH Reports ──────────────────────────────────────────────────
  /api/wfh/reports:
    get:
      tags: [WFH Reports]
      summary: List WFH reports for current user
      description: >
        Returns paginated WFH reports for the authenticated user. When `date`
        is supplied, only reports for that exact day are returned. When `month`
        (format `YYYY-MM`) is supplied, reports within that calendar month are
        returned. `date` takes precedence over `month` when both are supplied.
        When neither is supplied, all of the user's reports are returned
        (no date filter).
      operationId: listWfhReports
      parameters:
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
            maximum: 100
          example: 15
        - name: date
          in: query
          description: Filter reports by exact date (YYYY-MM-DD). Takes precedence over `month`.
          schema:
            type: string
            format: date
          example: "2026-08-10"
        - name: month
          in: query
          description: Filter reports within a calendar month (YYYY-MM).
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
          example: "2026-08"
      responses:
        "200":
          description: Paginated report list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WfhReportListResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Unauthenticated.
        "422":
          description: Validation error (invalid date or month format)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: "The date field is not a valid date."
    post:
      tags: [WFH Reports]
      summary: Create a WFH report
      operationId: createWfhReport
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/StoreReportRequest"
            example:
              report_date: "2025-07-11"
              status: draft
              activities:
                - start_time: "08:00"
                  end_time: "10:00"
                  activity: "Menyusun dokumentasi API modul WFH"
                  links:
                    - https://git.kominfo.go.id/intern/wfh-api/-/merge_requests/12
                - start_time: "10:00"
                  end_time: "12:00"
                  activity: "Review kode fitur change management"
                - start_time: "13:00"
                  end_time: "15:30"
                  activity: "Perbaikan bug validasi tanggal absensi"
                  links:
                    - https://git.kominfo.go.id/intern/wfh-api/-/issues/34
              attendances:
                pagi:
                  photo: <binary file upload>
      responses:
        "200":
          description: Existing draft/rejected report returned (get-or-create)
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Laporan WFH sudah ada.
                  data:
                    $ref: "#/components/schemas/WfhReportResource"
        "201":
          description: Report created
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Laporan WFH berhasil dibuat.
                  data:
                    $ref: "#/components/schemas/WfhReportResource"
              example:
                success: true
                message: Laporan WFH berhasil dibuat.
                data:
                  id: 23
                  user_id: 1
                  report_date: "2025-07-11"
                  status: draft
                  maker_signed_at: null
                  supervisor_signed_at: null
                  reject_reason: null
                  created_at: "2025-07-11T14:00:00.000000Z"
                  updated_at: "2025-07-11T14:00:00.000000Z"
                  user:
                    id: 1
                    name: Budi Santoso
                    nip: "199001012023011001"
                    position: Staf Pelaksana
                    rank: Pengatur Muda
                  activities:
                    - id: 67
                      start_time: "08:00"
                      end_time: "10:00"
                      activity: "Menyusun dokumentasi API modul WFH"
                      sort_order: 1
                      links:
                        - id: 89
                          url: https://git.kominfo.go.id/intern/wfh-api/-/merge_requests/12
                          sort_order: 1
                    - id: 68
                      start_time: "10:00"
                      end_time: "12:00"
                      activity: "Review kode fitur change management"
                      sort_order: 2
                      links: []
                    - id: 69
                      start_time: "13:00"
                      end_time: "15:30"
                      activity: "Perbaikan bug validasi tanggal absensi"
                      sort_order: 3
                      links:
                        - id: 90
                          url: https://git.kominfo.go.id/intern/wfh-api/-/issues/34
                          sort_order: 1
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Unauthenticated.
        "403":
          description: Missing permission wfh.report.create
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: This action is unauthorized.
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: "The report date field is required."
  /api/wfh/reports/{report}:
    get:
      tags: [WFH Reports]
      summary: Get WFH report by ID
      operationId: getWfhReportById
      parameters:
        - $ref: "#/components/parameters/ReportIdPath"
      responses:
        "200":
          description: Report data
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/WfhReportResource"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Unauthenticated.
        "403":
          description: Not owner and missing permission wfh.monitoring.view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: This action is unauthorized.
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Laporan tidak ditemukan.
    put:
      tags: [WFH Reports]
      summary: Update WFH report
      description: |
        v6.0.0 narrowed to metadata only (`report_date`). The full-replace
        behaviour (embedded activities/attendances arrays) is retired — use
        the row-by-row sub-resource endpoints under `/activities` and
        `/attendances`. Status transitions go via submit/approve/reject/revise.
        Actor must own the report; report must be `draft` or `rejected`.
      operationId: updateWfhReport
      parameters:
        - $ref: "#/components/parameters/ReportIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [report_date]
              description: |
                Metadata only. Embedded activities/attendances are no longer
                accepted — use the sub-resource endpoints. Status transitions
                go via submit/approve/reject/revise, never via PUT.
              properties:
                report_date:
                  type: string
                  format: date
            example:
              report_date: "2025-07-11"
      responses:
        "200":
          description: Report updated
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Laporan WFH berhasil diperbarui.
                  data:
                    $ref: "#/components/schemas/WfhReportResource"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Unauthenticated.
        "403":
          description: Not owner or missing permission wfh.report.update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: This action is unauthorized.
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Laporan tidak ditemukan.
        "422":
          description: Report already approved or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Laporan yang sudah disetujui tidak dapat diubah.
    delete:
      tags: [WFH Reports]
      summary: Delete WFH report
      operationId: deleteWfhReport
      parameters:
        - $ref: "#/components/parameters/ReportIdPath"
      responses:
        "200":
          description: Report deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                message: Laporan WFH berhasil dihapus.
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Unauthenticated.
        "403":
          description: Not owner or missing permission wfh.report.delete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: This action is unauthorized.
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Laporan tidak ditemukan.
        "422":
          description: Report already approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Laporan yang sudah disetujui tidak dapat dihapus.
  /api/wfh/reports/{report}/submit:
    post:
      tags: [WFH Reports]
      summary: Submit report for approval
      operationId: submitWfhReport
      parameters:
        - $ref: "#/components/parameters/ReportIdPath"
      responses:
        "200":
          description: Report submitted
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Laporan berhasil disubmit untuk persetujuan.
                  data:
                    $ref: "#/components/schemas/WfhReportResource"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Unauthenticated.
        "403":
          description: Not the report owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: This action is unauthorized.
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Laporan tidak ditemukan.
        "422":
          description: Empty content (no activities AND no attendances), or invalid state transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                emptyContent:
                  summary: Draft has no activities and no attendances
                  value:
                    success: false
                    message: "Setidaknya satu kegiatan atau satu absensi harus diisi sebelum submit."
                badState:
                  summary: Report is not in draft state
                  value:
                    success: false
                    message: "Hanya laporan dengan status draft yang dapat disubmit."
  /api/wfh/reports/{report}/approve:
    post:
      tags: [WFH Reports]
      summary: Approve a WFH report
      operationId: approveWfhReport
      description: |
        Approves a pending WFH report. Field-scoped guard since v5.0.0: actor must
        be in the same field as the report owner. No admin break-glass. Requires
        `wfh.report.approve` permission.
      parameters:
        - $ref: "#/components/parameters/ReportIdPath"
      responses:
        "200":
          description: Report approved
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Laporan berhasil disetujui.
                  data:
                    $ref: "#/components/schemas/WfhReportResource"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Unauthenticated.
        "403":
          description: Missing permission wfh.report.approve
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: This action is unauthorized.
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Laporan tidak ditemukan.
        "422":
          description: Invalid state transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: "Laporan dengan status draft tidak dapat disetujui."
  /api/wfh/reports/{report}/reject:
    post:
      tags: [WFH Reports]
      summary: Reject a WFH report
      operationId: rejectWfhReport
      description: |
        Rejects a pending WFH report with a reason. Field-scoped guard since v5.0.0:
        actor must be in the same field as the report owner. No admin break-glass.
        Requires `wfh.report.reject` permission.
      parameters:
        - $ref: "#/components/parameters/ReportIdPath"
