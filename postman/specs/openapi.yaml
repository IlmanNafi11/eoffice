    # ── Auth: Forced Password Change ─────────────────────────────────
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password, new_password_confirmation]
      properties:
        current_password:
          type: string
          format: password
          example: rahasiaLama123
        new_password:
          type: string
          format: password
          minLength: 8
          example: rahasiaBaru123
        new_password_confirmation:
          type: string
          format: password
          example: rahasiaBaru123
      example:
        current_password: rahasiaLama123
        new_password: rahasiaBaru123
        new_password_confirmation: rahasiaBaru123
    # ── Auth: Public Password Reset (OTP) ────────────────────────────
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: Email akun yang lupa password. Tidak membocorkan status pendaftaran — respons selalu 200 generic.
          example: budi@kominfo.go.id
      example:
        email: budi@kominfo.go.id
    VerifyOtpRequest:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
          example: budi@kominfo.go.id
        code:
          type: string
          pattern: '^[0-9]{6}$'
          minLength: 6
          maxLength: 6
          description: Kode OTP 6-digit yang dikirim ke email. Hashed di DB (argon2id); satu kali pakai; kedaluwarsa 15 menit; lockout setelah 5 percobaan gagal.
          example: "829341"
      example:
        email: budi@kominfo.go.id
        code: "829341"
    ResetPasswordRequest:
      type: object
      required: [reset_token, new_password, new_password_confirmation]
      properties:
        reset_token:
          type: string
          minLength: 60
          description: Token reset 60-char yang diterbitkan oleh verify-otp. Disimpan di cache TTL 5 menit, satu kali pakai.
          example: "a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2"
        new_password:
          type: string
          format: password
          minLength: 8
          example: rahasiaBaru123
        new_password_confirmation:
          type: string
          format: password
          example: rahasiaBaru123
      example:
        reset_token: "a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2"
        new_password: rahasiaBaru123
        new_password_confirmation: rahasiaBaru123
    VerifyOtpResponse:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: OTP terverifikasi. Gunakan reset_token untuk mengatur password baru.
        data:
          type: object
          required: [reset_token]
          properties:
            reset_token:
              type: string
              minLength: 60
              description: Token reset satu kali pakai (cache TTL 5 menit). Kirim ke POST /api/auth/reset-password.
              example: "a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2"
      example:
        success: true
        message: OTP terverifikasi. Gunakan reset_token untuk mengatur password baru.
        data:
          reset_token: "a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2"
    ResetPasswordSuccessResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Password berhasil diatur. Silakan login.
      example:
        success: true
        message: Password berhasil diatur. Silakan login.
