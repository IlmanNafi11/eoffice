openapi: 3.0.3
info:
  title: Intern Kominfo API
  version: 6.6.0
  description: |
    API for the Intern Kominfo application — a government intern management
    platform with Work-From-Home (WFH) reporting, change management workflows,
    user administration, and QR-based document verification.

    Authentication uses Laravel Sanctum bearer tokens.
    Authorization uses Spatie permission-based roles (admin, kepala_bidang, kepala_tim, staf).


    **v6.6.0 — Unified user payload:**
    - All user-bearing endpoints (`/auth/login`, `/auth/me`, `/profile`,
      `/admin/users*`) now emit the single `UserResource` shape.
    - Breaking: `direct_permissions` is gone from `/admin/users*`; replaced by
      `permissions` (role + direct, same key as auth/profile endpoints).
    - `/admin/users*` now also returns `signature_url`, `must_change_password`,
      and `team.leader`.
    - Removed the separate `TeamFlat` schema; `team` is always `TeamNested`.
    - Deleted the `FormatsUserPayload` trait (code cleanup, no behavior beyond
      the key changes above).

    **v6.5.0 — WFH report list default to all:**
    - `GET /api/wfh/reports` no longer defaults to today when no `date`/`month`
      is supplied; it now returns all of the user's reports. Supply `date=today`
      to restore the old behavior.
    - `GET /api/admin/wfh/reports` unchanged (already defaulted to all).
    - `GET /api/admin/wfh/monitoring` unchanged (date-specific; still defaults to today).

    **v6.4.0 — WFH report date/month query filters:**
    - `GET /api/wfh/reports` now accepts `date` (exact day, `YYYY-MM-DD`) and
      `month` (calendar month, `YYYY-MM`) query params. `date` takes precedence
      over `month`; when neither is supplied, defaults to today. Invalid values
      return 422.
    - `GET /api/admin/wfh/reports` accepts the same `date`/`month` params;
      existing `date_from`/`date_to` take precedence when present, and no date
      filter still returns all reports (admin behavior unchanged).

    **v6.3.0 — Public password reset (OTP via Resend):**
    - Added 3 public endpoints (no auth, throttle:auth 5/min per email|ip):
      `POST /api/auth/forgot-password`, `POST /api/auth/verify-otp`,
      `POST /api/auth/reset-password`.
    - Anti-enumeration: forgot-password always returns 200 generic; no OTP
      dispatched for unregistered or inactive users.
    - OTP is 6-digit, hashed (argon2id) in `password_reset_otps`, expires in
      15 min, single-use (verified once then `used_at` set), brute-force lockout
      after 5 failed attempts.
    - Verify-otp issues a 60-char reset token cached for 5 min (one-time);
      the OTP code itself is never sent to the reset endpoint.
    - Reset-password consumes the cached reset token and sets the new password,
      clearing `must_change_password`.
    - Dropped the default Laravel `password_reset_tokens` table (unused).
    - New schemas: `ForgotPasswordRequest`, `VerifyOtpRequest`,
      `ResetPasswordRequest`, `VerifyOtpResponse`, `ResetPasswordSuccessResponse`.

    **v6.2.0 — Added GET /change-types (reference data):
    - Added `GET /api/change-types` — returns all change types (no permission
      gate beyond auth+sanctum).
    - Added `ChangeType` schema with id/name.
    - Added `ChangeTypeListResponse` envelope.
    - Real examples: Hardware, Network, Software, Utilities, Aplikasi,
      Prosedur, Operating System, Personil.

    **v6.1.0 — Spec sync with codebase:**
    - Added `GET /wfh/session-config` (returns WFH session names + allowed days from Settings).
    - `AuthUser` schema now includes `signature_url`.
    - `UserResource` now emits `leader`/`field` under `team` via `TeamNested`,
      matching auth/profile endpoints. `UserResource` switched to `TeamNested`.
    - `WfhReportResource` now documents `activity_count` and conditional `attendances[]`.
    - `WfhReportActivity.links[].sort_order` noted as present only in full report
      responses (WfhReportResource); sub-resource responses (POST/PUT activity) omit it.
    - `AttendanceResponse.data.session` enum fixed to `[pagi, siang, sore]`.
    - Change Management single-item responses now wrapped in the `ChangePackageResponse`
      envelope `{success, message, data}` (matches controller).
    - `ImplementationResource.cost_amount` + request schemas retyped `string` (decimal:2 cast).
    - `InitiationResource.verification_token` removed (resource never serializes it).
    - `GET /changes` now documents the `field_id` query filter.
    - `ChangePackageSubmitRequest.implementation` now lists the 5 nullable impl props.
    - `POST /changes/{id}/attachments` 200 now documents the returned `data: attachments[]`.
    - `GET /admin/wfh/teams/{team}/pdf` now documents `team_report_id` query + 401.
    - `/admin/wfh/team-reports/{id}/reject` 403 description notes the dual permission gate.
    - `POST /admin/users/import` response `data` retyped object `{imported, skipped, errors}`.
    - `POST|PUT /admin/users` request examples fixed `role` → `roles` (plural array).
    - `POST /profile/signature` 200 now refs `SignatureUploadResponse`.
    - `/auth/login`, `/auth/me`, `/profile` inline examples now include all always-emitted
      fields (`signature_url`, `must_change_password`, `permissions`, `team`).
    - Monitoring repo (code) fixed to select safe columns + eager-load `team:id,name`,
      matching the documented `MonitoringUser` shape (previously leaked PII columns).

    **v6.0.0 — WFH Draft sub-resource (breaking):**
    - `POST /wfh/attendance` removed. Attendance rows are appended via
      `POST /wfh/reports/{report}/attendances` (carries `report_id`).
    - Activity editing is now row-by-row: `POST|PUT|DELETE /wfh/reports/{report}/activities[/{activity}]`
      plus `PATCH /wfh/reports/{report}/activities/reorder`.
    - `PUT /wfh/reports/{report}` narrowed to metadata (`report_date` only);
      embedded activities/attendances are ignored — use the sub-resource endpoints.
    - `POST /wfh/reports` is get-or-create: returns the existing draft/rejected
      report for `(user, report_date)` with `200` instead of duplicating (201).
    - Submit content guard moved DB-side: `POST /wfh/reports/{report}/submit`
      rejects (422) drafts with zero activities AND zero attendances.

    **v5.0.0 — KB (Kepala Bidang) full support:**
    - New permission `wfh.team_report.view` — KB dan KT dapat list team-report.
    - New permission `wfh.team_report.reject` — pisah dari approve (konsisten dengan modul individu).
    - Field-scoped guard di approve/reject (individu + team-report). Admin TIDAK ada break-glass.
    - Monitoring scope by field head: KB lihat seluruh bidang, KT lihat tim sendiri.
    - `GET /profile` sekarang identik dengan `GET /auth/me` (team.field + permissions).
    - `POST /auth/login` response sekarang bawa `team.field`.
    - Team-report approve set `supervisor_id` = actor.

    **v4.0.0 — Breaking change (Change Package):** the serial two-step change
    flow (`/changes/initiations/*` + `/changes/implementations/*`) is removed.
    It is replaced by a single nested package flow at `/changes/*` where the
    staf fills all form fields (initiation + implementation) and the kepala_tim
    only approves or rejects. See the `Change Package` tag for the 11 new routes.

    The `kepala_bidang` role (field head) approves WFH reports as "atasan langsung".
    The `kepala_tim` role (team leader) approves/rejects change packages.
servers:
  - url: http://localhost
    description: Local development server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  schemas:
    # ── Envelope wrappers ──────────────────────────────────────────
    ErrorResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Email atau password salah.
    SuccessResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Logout berhasil.
    PaginationMeta:
      type: object
      required: [current_page, last_page, total]
      properties:
        current_page:
          type: integer
          example: 1
        last_page:
          type: integer
          example: 5
        total:
          type: integer
          example: 72
    # ── Auth ────────────────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: budi@kominfo.go.id
        password:
          type: string
          format: password
          example: rahasia123
      example:
        email: budi@kominfo.go.id
        password: rahasia123
    LoginResponse:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Login berhasil.
        data:
          type: object
          required: [token, user]
          properties:
            token:
              type: string
              example: "1|abcdef1234567890abcdef1234567890abcdef12"
            user:
              $ref: "#/components/schemas/AuthUser"
      example:
        success: true
        message: Login berhasil.
        data:
          token: "1|abcdef1234567890abcdef1234567890abcdef12"
          user:
            id: 1
            name: Budi Santoso
            nip: "199001012023011001"
            email: budi@kominfo.go.id
            rank: Pengatur Muda
            position: Staf Pelaksana
            phone: "081234567890"
            must_change_password: true
            is_active: true
            roles: [staf]
            permissions: [wfh.attendance.create, wfh.report.create]
            team:
              id: 3
              name: Tim Aplikasi
              leader:
                id: 5
                name: Siti Nurhaliza
              field:
                id: 1
                name: Bidang Teknologi Informasi
    AuthUser:
      type: object
      required: [id, name, nip, email, must_change_password, is_active, roles, permissions]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Budi Santoso
        nip:
          type: string
          example: "199001012023011001"
        email:
          type: string
          format: email
          example: budi@kominfo.go.id
        rank:
          type: string
          nullable: true
          example: Pengatur Muda
        position:
          type: string
          nullable: true
          example: Staf Pelaksana
        phone:
          type: string
          nullable: true
          example: "081234567890"
        signature_url:
          type: string
          nullable: true
          format: uri
          description: Absolute URL to signature image (asset(storage/{path})); null when no signature set.
          example: http://localhost/storage/signatures/budi-signature.png
        must_change_password:
          type: boolean
          description: True when the user must set a new password before full access is granted.
          example: true
        is_active:
          type: boolean
          example: true
        roles:
          type: array
          items:
            type: string
          example: [staf]
        permissions:
          type: array
          items:
            type: string
          example: [wfh.attendance.create, wfh.report.create]
        team:
          $ref: "#/components/schemas/TeamNested"
    # ── Profile ─────────────────────────────────────────────────────
    ProfileData:
      type: object
      description: |
        User payload returned by GET /profile, PUT /profile, GET /auth/me, and POST /auth/login.
        Since v6.6.0, all four endpoints use the single shared `UserResource`,
        so the structure is identical across all of them — including team.field and permissions.
      required: [id, name, nip, email, must_change_password, is_active, roles, permissions]
      properties:
        id:
          type: integer
          example: 4
        name:
          type: string
          example: Budi Kepala Bidang
        nip:
          type: string
          example: "197508122003121002"
        email:
          type: string
          format: email
          example: kepala.bidang@kominfo.go.id
        rank:
          type: string
          nullable: true
          example: Pembina
        position:
          type: string
          nullable: true
          example: Kepala Bidang Pengembangan Aplikasi
        phone:
          type: string
          nullable: true
          example: "081234567890"
        signature_url:
          type: string
          nullable: true
          format: uri
          example: http://localhost/storage/signatures/budi-kb-signature.png
        must_change_password:
          type: boolean
          example: false
        is_active:
          type: boolean
          example: true
        roles:
          type: array
          items:
            type: string
          example: [kepala_bidang]
        permissions:
          type: array
          items:
            type: string
          example: [wfh.attendance.create, wfh.report.create, wfh.report.update, wfh.report.submit, wfh.report.approve, wfh.report.reject, wfh.monitoring.view, wfh.report.export_pdf, wfh.team_report.view, wfh.team_report.approve, wfh.team_report.reject]
        team:
          $ref: "#/components/schemas/TeamNested"
      example:
        id: 4
        name: Budi Kepala Bidang
        nip: "197508122003121002"
        email: kepala.bidang@kominfo.go.id
        rank: Pembina
        position: Kepala Bidang Pengembangan Aplikasi
        phone: "081234567890"
        signature_url: http://localhost/storage/signatures/budi-kb-signature.png
        must_change_password: false
        is_active: true
        roles: [kepala_bidang]
        permissions: [wfh.attendance.create, wfh.report.create, wfh.report.update, wfh.report.submit, wfh.report.approve, wfh.report.reject, wfh.monitoring.view, wfh.report.export_pdf, wfh.team_report.view, wfh.team_report.approve, wfh.team_report.reject]
        team:
          id: 2
          name: Tim Pengembangan
          leader:
            id: 3
            name: Koko Kepala Tim
          field:
            id: 2
            name: Bidang Pengembangan Aplikasi
    UpdateProfileRequest:
      type: object
      properties:
        phone:
          type: string
          maxLength: 20
          nullable: true
          example: "081298765432"
        position:
          type: string
          maxLength: 255
          nullable: true
          example: Analis Sistem Informasi
        rank:
          type: string
          maxLength: 255
          nullable: true
          example: Penata Muda
      example:
        phone: "081298765432"
        position: Analis Sistem Informasi
        rank: Penata Muda
    SignatureUploadResponse:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Tanda tangan berhasil diunggah.
        data:
          type: object
          required: [signature_url]
          properties:
            signature_url:
              type: string
              format: uri
              example: http://localhost/storage/signatures/1-signature.png
      example:
        success: true
        message: Tanda tangan berhasil diunggah.
        data:
          signature_url: http://localhost/storage/signatures/1-signature.png
    # ── User Management ─────────────────────────────────────────────
    StoreUserRequest:
      type: object
      required: [name, nip, email, roles]
      properties:
        name:
          type: string
          maxLength: 255
          example: Dewi Lestari
        nip:
          type: string
          maxLength: 50
          example: "199503152024011002"
        email:
          type: string
          format: email
          example: dewi@kominfo.go.id
        team_id:
          type: integer
          nullable: true
          example: 3
        rank:
          type: string
          maxLength: 255
          nullable: true
          example: Pengatur Muda
        position:
          type: string
          maxLength: 255
          nullable: true
          example: Staf Pelaksana
        phone:
          type: string
          maxLength: 20
          nullable: true
          example: "081345678901"
        password:
          type: string
          format: password
          nullable: true
          minLength: 8
          maxLength: 255
          description: Optional. If omitted, a default password is injected from Settings based on the assigned role.
          example: rahasiaBudi123
        roles:
          type: array
          items:
            type: string
            enum: [admin, kepala_bidang, kepala_tim, staf]
          example: [staf]
        permissions:
          type: array
          nullable: true
          description: Direct permissions assigned to the user (overrides role defaults).
          items:
            type: string
          example: [wfh.report.approve]
      example:
        name: Budi Santoso
        nip: "199503152024011002"
        email: budi@kominfo.go.id
        team_id: 3
        rank: Penata Muda
        position: Programmer
        phone: "081234567890"
        roles: [staf]
      description: |
        Password is OPTIONAL. If omitted, the system injects a default from Settings:
          - role 'admin' → Setting::get('password_default_admin')
          - any other role → Setting::get('password_default_user')
        The created user always has must_change_password=true.
    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
          example: Dewi Lestari Wijaya
        nip:
          type: string
          maxLength: 50
          example: "199503152024011002"
        email:
          type: string
          format: email
          example: dewi.wijaya@kominfo.go.id
        team_id:
          type: integer
          nullable: true
          example: 5
        rank:
          type: string
          maxLength: 255
          nullable: true
          example: Penata Muda
        position:
          type: string
          maxLength: 255
          nullable: true
          example: Analis Sistem Informasi
        phone:
          type: string
          maxLength: 20
          nullable: true
          example: "081334455667"
        roles:
          type: array
          items:
            type: string
            enum: [admin, kepala_bidang, kepala_tim, staf]
          example: [kepala_tim]
        permissions:
          type: array
          description: Direct permissions (syncs — replaces all direct permissions).
          items:
            type: string
          example: [change.implementation.review]
        is_active:
          type: boolean
          example: true
      example:
        name: Andi Wijaya
        position: Analis Sistem Informasi
        rank: Penata Muda
        roles: [kepala_tim]
        is_active: true
    UserResource:
      type: object
      required: [id, name, nip, email, is_active]
      properties:
        id:
          type: integer
          example: 12
        name:
          type: string
          example: Dewi Lestari
        nip:
          type: string
          example: "199503152024011002"
        email:
          type: string
          format: email
          example: dewi@kominfo.go.id
        rank:
          type: string
          nullable: true
          example: Pengatur Muda
        position:
          type: string
          nullable: true
          example: Staf Pelaksana
        phone:
          type: string
          nullable: true
          example: "081345678901"
        is_active:
          type: boolean
          example: true
        roles:
          type: array
          items:
            type: string
          example: [staf]
        permissions:
          type: array
          items:
            type: string
          description: All permissions (role + direct) — used by clients to build menus. Present on user detail/create/update responses.
          example: [wfh.attendance.create, wfh.report.create, wfh.report.update]
        created_at:
          type: string
          format: date-time
          nullable: true
          example: "2025-07-14T08:30:00.000000Z"
        team:
          $ref: "#/components/schemas/TeamNested"
      example:
        id: 12
        name: Dewi Lestari
        nip: "199503152024011002"
        email: dewi@kominfo.go.id
        rank: Pengatur Muda
        position: Staf Pelaksana
        phone: "081345678901"
        signature_url: null
        must_change_password: false
        permissions: [wfh.attendance.create, wfh.report.create, wfh.report.update]
        created_at: "2025-07-14T08:30:00.000000Z"
        team:
          id: 3
          name: Tim Aplikasi
          field:
            id: 1
            name: Bidang Teknologi Informasi
    TeamNested:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          example: 3
        name:
          type: string
          example: Tim Aplikasi
        leader:
          type: object
          properties:
            id:
              type: integer
              example: 5
            name:
              type: string
              example: Siti Nurhaliza
        field:
          type: object
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: Bidang Teknologi Informasi
      example:
        id: 3
        name: Tim Aplikasi
        leader:
          id: 5
          name: Siti Nurhaliza
        field:
          id: 1
          name: Bidang Teknologi Informasi
    # Flat team record used by GET /teams dropdown endpoint
    TeamResource:
      type: object
      required: [id, name, leader_id, field_id]
      properties:
        id:
          type: integer
          example: 3
        name:
          type: string
          example: Tim Aplikasi Informatika
        leader_id:
          type: integer
          nullable: true
          description: ID user kepala tim. Null jika belum ditunjuk.
          example: 12
        field_id:
          type: integer
          nullable: true
          description: ID bidang tempat tim berada. Null jika belum ditetapkan.
          example: 1
      example:
        id: 3
        name: Tim Aplikasi Informatika
        leader_id: 12
        field_id: 1
    TeamListResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/TeamResource"
      example:
        success: true
        data:
          - id: 3
            name: Tim Aplikasi Informatika
            leader_id: 12
            field_id: 1
          - id: 4
            name: Tim Jaringan dan Infrastruktur
            leader_id: 18
            field_id: 2
          - id: 5
            name: Tim Keamanan Siber
            leader_id: 9
            field_id: 1
    UserListResponse:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/UserResource"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
      example:
        success: true
        data:
          - id: 1
            name: Budi Santoso
            nip: "199001012023011001"
            email: budi@kominfo.go.id
            rank: Pengatur Muda
            position: Staf Pelaksana
            phone: "081234567890"
            is_active: true
            roles: [staf]
            created_at: "2025-07-01T08:00:00.000000Z"
            team:
              id: 3
              name: Tim Aplikasi
              field:
                id: 1
                name: Bidang Teknologi Informasi
          - id: 12
            name: Dewi Lestari
            nip: "199503152024011002"
            email: dewi@kominfo.go.id
            rank: Pengatur Muda
            position: Staf Pelaksana
            phone: "081345678901"
            is_active: true
            roles: [staf]
            created_at: "2025-07-14T08:30:00.000000Z"
            team:
              id: 3
              name: Tim Aplikasi
              field:
                id: 1
                name: Bidang Teknologi Informasi
        meta:
          current_page: 1
          last_page: 5
          total: 72
    # ── WFH Session Config ─────────────────────────────────────────
    WfhSessionConfigResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [sessions, allowed_days]
          properties:
            sessions:
              type: array
              description: WFH session names (Indonesian). Sourced from Settings key `wfh_sessions`; defaults to [pagi, siang, sore].
              items:
                type: string
                enum: [pagi, siang, sore]
              example: [pagi, siang, sore]
            allowed_days:
              type: array
              description: ISO day-of-week ints allowed for WFH (1=Mon..7=Sun). Sourced from Settings key `wfh_allowed_days`; defaults to Mon–Fri.
              items:
                type: integer
              example: [1, 2, 3, 4, 5]
      example:
        data:
          sessions: [pagi, siang, sore]
          allowed_days: [1, 2, 3, 4, 5]
    # ── WFH Attendance ──────────────────────────────────────────────
    AttendanceResponse:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Absensi WFH berhasil.
        data:
          type: object
          required: [id, date, session, photo_url, check_in_at]
          properties:
            id:
              type: integer
              example: 45
            date:
              type: string
              format: date
              example: "2025-07-11"
            session:
              type: string
