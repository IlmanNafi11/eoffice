          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                message: Absensi berhasil dihapus.
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Unauthenticated.
        "403":
          description: Not the report owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: "Tidak dapat mengubah laporan orang lain."
        "404":
          description: Attendance not found under this report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: "Absensi tidak ditemukan."
        "422":
          description: Report not editable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: "Laporan yang sudah disetujui tidak dapat diubah."
  /api/wfh/reports/{report}/pdf:
    get:
      tags: [WFH Reports]
      summary: Export WFH report as PDF (personal)
      operationId: exportWfhReportPdf
      security:
        - bearerAuth: []
      description: |
        Generates a personal WFH report PDF (Laporan Pelaksanaan Tugas WFH).
        Available from `pending` status — the maker (staf) must have set their
        signature in their profile first; export is refused with 422 otherwise.
        Kepala Bidang signature + QR code appear only when `approved`, and the
        supervisor must also have set their signature before an approved report
        can be exported.
      parameters:
        - $ref: "#/components/parameters/ReportIdPath"
      responses:
        "200":
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Unauthenticated.
        "403":
          description: Missing permission wfh.report.export_pdf
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: This action is unauthorized.
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Laporan tidak ditemukan.
        "422":
          description: Report not exportable (not submitted) or a signer's signature is not set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unsubmitted:
                  summary: Laporan belum disubmit
                  value:
                    success: false
                    message: PDF hanya dapat di-generate untuk laporan yang sudah disubmit atau disetujui.
                missing-signature:
                  summary: Tanda tangan belum diatur
                  value:
                    success: false
                    message: Andi belum mengatur tanda tangan. Atur tanda tangan terlebih dahulu sebelum mengekspor PDF.
  /api/wfh/session-config:
    get:
      tags: [WFH Settings]
      summary: Get WFH session config (session names + allowed days)
      operationId: getWfhSessionConfig
      security:
        - bearerAuth: []
      description: |
        Returns the WFH session configuration used by the client to drive the
        attendance UI: the list of session names (pagi/siang/sore) and the
        ISO day-of-week ints on which WFH attendance is allowed (1=Mon..7=Sun).
        Sourced from Settings keys `wfh_sessions` and `wfh_allowed_days`, falling
        back to inline defaults ([pagi, siang, sore] / [1-5]) when rows absent.
        No permission gate — any authenticated role may call this.
      responses:
        "200":
          description: WFH session configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WfhSessionConfigResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Unauthenticated.
  # ── WFH Monitoring ───────────────────────────────────────────────
  /api/admin/wfh/monitoring:
    get:
      tags: [WFH Monitoring]
      summary: Monitor WFH attendance and reports (field-scoped since v5.0.0)
      operationId: getWfhMonitoring
      description: |
        Returns users who haven't checked in or submitted a report for a given date.
        Scope depends on role since v5.0.0:
        - admin → all users (team_id=null, field_id=null)
        - kepala_bidang (field head) → entire field (field_id set, team_id=null)
        - kepala_tim / others → own team (team_id set, field_id=null)
        If team_id is passed explicitly, it must belong to the actor's field (cross-field → 403).
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
          description: Defaults to today.
          example: "2026-07-25"
        - name: team_id
          in: query
          schema:
            type: integer
          description: |
            Filter by specific team. Must belong to actor's field — cross-field
            attempts return 403. If omitted: admin sees all, KB sees entire field,
            others default to own team.
          example: 2
      responses:
        "200":
          description: Monitoring data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WfhMonitoringResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Unauthenticated.
        "403":
          description: Missing permission wfh.monitoring.view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: This action is unauthorized.
  # ── QR Verification ──────────────────────────────────────────────
  /api/admin/wfh/reports:
    get:
      tags: [WFH Monitoring]
      summary: List WFH reports within admin\'s field (bidang-scoped)
      operationId: adminListWfhReports
      security:
        - bearerAuth: []
      description: |
        Returns paginated WFH reports from all staff within the admin's own
        field (bidang). Auto-filtered by field_id. Supports optional filters.
        `date_from`/`date_to` take precedence; when absent, `date` (exact day)
        or `month` (YYYY-MM) apply. No date filter returns all reports.
        Requires `wfh.monitoring.view` permission.
      parameters:
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
          example: 15
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, pending, approved, rejected]
          example: approved
        - name: team_id
          in: query
          schema:
            type: integer
          example: 3
        - name: date_from
          in: query
          schema:
            type: string
            format: date
          example: "2026-07-01"
        - name: date_to
          in: query
          schema:
            type: string
            format: date
          example: "2026-07-15"
        - name: date
          in: query
          description: Filter reports by exact date (YYYY-MM-DD). Used only when `date_from`/`date_to` are absent. Takes precedence over `month`.
          schema:
            type: string
            format: date
          example: "2026-08-10"
        - name: month
          in: query
          description: Filter reports within a calendar month (YYYY-MM). Used only when `date_from`/`date_to` and `date` are absent.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
          example: "2026-08"
      responses:
        "200":
          description: Paginated WFH reports within the admin\'s field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WfhReportListResponse"
        "403":
          description: Missing wfh.monitoring.view permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Admin user has no field association
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: User tidak terhubung dengan bidang manapun.
  /api/admin/wfh/teams/{team}/pdf:
    get:
      tags: [WFH Reports]
      summary: Export team WFH summary as PDF (admin bidang)
      operationId: exportTeamWfhPdf
      security:
        - bearerAuth: []
      description: |
        Generates a combined PDF report for all staff in a team for a specific date.
        The admin (maker) signs from their profile.
        The Kepala Bidang (field head) appears as "Atasan Langsung".
        Requires `wfh.report.export_pdf` permission. Team must belong to admin\'s field.
      parameters:
        - name: team
          in: path
          required: true
          schema:
            type: integer
          description: Team ID (must be within admin\'s field)
          example: 3
        - name: date
          in: query
          schema:
            type: string
            format: date
          description: Date of the WFH reports to include
          example: "2026-07-15"
        - name: team_report_id
          in: query
          schema:
            type: integer
            nullable: true
          description: Optional WfhTeamReport ID. When set, controller toggles an isApproved flag that controls whether the supervisor (Kepala Bidang) signature is rendered on the PDF.
          example: 12
      responses:
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Unauthenticated.
        "200":
          description: PDF binary
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "403":
          description: Team not in admin\'s field or missing permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Tim tidak ditemukan dalam bidang Anda.
        "422":
          description: A signer's signature is not set (maker or, when approved, the Kepala Bidang)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Andi belum mengatur tanda tangan. Atur tanda tangan terlebih dahulu sebelum mengekspor PDF.

  # ── WFH Team Reports ──────────────────────────────────────────────
  /api/admin/wfh/team-reports:
    get:
      tags: [WFH Team Reports]
      summary: List team reports within the admin's field (paginated)
      operationId: listWfhTeamReports
      security:
        - bearerAuth: []
      description: |
        Returns a paginated list of WFH team reports. Scope depends on role:
        admin sees all; kepala_bidang (field head) sees all teams in their field;
        kepala_tim and other users see only their own team's reports. Requires the
        `wfh.team_report.view` permission (assigned to kepala_bidang and kepala_tim).
      parameters:
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
            maximum: 100
          example: 15
      responses:
        "200":
          description: Paginated team reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamReportListResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Unauthenticated.
        "403":
          description: Missing wfh.team_report.view permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: This action is unauthorized.
    post:
      tags: [WFH Team Reports]
      summary: Create a team report
      operationId: createWfhTeamReport
      security:
        - bearerAuth: []
      description: |
        Creates a team report with status=pending and created_by set to the
        authenticated user. The referenced team must belong to the admin's own
        field. Requires the `wfh.team_report.create` permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamReportRequest"
      responses:
        "201":
          description: Team report created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/WfhTeamReport"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Unauthenticated.
        "403":
          description: Missing permission, or team outside admin's field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: Tim tidak ditemukan dalam bidang Anda.
        "422":
          description: Validation error or duplicate (same team_id + report_date)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: Laporan untuk tim dan tanggal ini sudah ada.
  /api/admin/wfh/team-reports/{id}/approve:
    post:
      tags: [WFH Team Reports]
      summary: Approve a team report
      operationId: approveWfhTeamReport
      security:
        - bearerAuth: []
      description: |
        Approves a pending team report: sets status=approved, records
        supervisor_id (actor), supervisor_signed_at, and generates a verification_token.
        Field-scoped guard: actor must be in the same field as the team report's team.
        No admin break-glass — admin in a different field gets 403. Requires the
        `wfh.team_report.approve` permission.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Team report ID
          example: 12
      responses:
        "200":
          description: Team report approved
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/WfhTeamReport"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Unauthenticated.
        "403":
          description: Missing wfh.team_report.approve permission, or team report outside actor's field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Laporan tidak berada dalam bidang Anda.
        "404":
          description: Team report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: Laporan tidak ditemukan.
        "422":
          description: Report is not in a pending state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Laporan tidak dapat disetujui pada status saat ini.
  /api/admin/wfh/team-reports/{id}/reject:
    post:
      tags: [WFH Team Reports]
      summary: Reject a team report
      operationId: rejectWfhTeamReport
      security:
        - bearerAuth: []
      description: |
        Rejects a pending team report with a reason: sets status=rejected and
        stores reject_reason. Field-scoped guard: actor must be in the same field.
        No admin break-glass. Requires the `wfh.team_report.reject` permission
        (separate from approve since v5.0.0).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Team report ID
          example: 12
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectTeamReportRequest"
      responses:
        "200":
          description: Team report rejected
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/WfhTeamReport"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Unauthenticated.
        "403":
          description: Missing permission (route middleware gates wfh.team_report.approve; controller body additionally requires wfh.team_report.reject), or team report outside actor's field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: This action is unauthorized.
        "404":
          description: Team report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: Laporan tidak ditemukan.
        "422":
          description: Report is not in a pending state, or reason missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Laporan tidak dapat ditolak pada status saat ini.
  /api/verify/{token}:
    get:
      tags: [Verification]
      summary: Verify a document by QR token
      operationId: verifyQrToken
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-f0-9]{64}$'
          description: 64-character hex verification token.
          example: a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2
      responses:
        "200":
          description: Document verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QrVerificationResponse"
        "404":
          description: Invalid or unknown token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Token verifikasi tidak ditemukan.
  # ── Change Types (reference data) ────────────────────────────────
  /api/change-types:
    get:
      tags: [Change Package]
      summary: List all change types (reference data)
      operationId: listChangeTypes
      description: |
        Returns all change type options used in the Change Package module.
        This is reference data for dropdown selects — no additional permission
        beyond authentication.
      responses:
        "200":
          description: Change type list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeTypeListResponse"
              example:
                success: true
                data:
                  - id: 1
                    name: Hardware
                  - id: 2
                    name: Network
                  - id: 3
                    name: Software
                  - id: 4
                    name: Utilities
                  - id: 5
                    name: Aplikasi
                  - id: 6
                    name: Prosedur
                  - id: 7
                    name: Operating System
                  - id: 8
                    name: Personil
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Unauthenticated.
  # ── Change Package ──────────────────────────────────────────────
  /api/changes:
    get:
      tags: [Change Package]
      summary: List packages (paginated, team-scoped)
      operationId: listPackages
      parameters:
        - name: per_page
          in: query
          schema: { type: integer, default: 15, maximum: 100 }
        - name: status
          in: query
          schema: { type: string, enum: [draft, pending, approved, rejected] }
        - name: field_id
          in: query
          schema: { type: integer, nullable: true }
          description: Filter packages by field (bidang). Controller accepts `status` + `field_id`.
          example: 3
      responses:
        "200":
          description: Paginated package list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePackageListResponse"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Change Package]
      summary: Create draft package (initiation + implementation 1:1)
      operationId: createPackage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePackageDraftRequest"
            example:
              initiation:
                field_id: 3
                needed_by_date: "2025-12-15"
                description: "Migrasi server aplikasi e-Office dari on-premise ke cloud Kominfo"
                reason: "Server on-premise saat ini sudah tidak memadai untuk menangani lonjakan trafik pengguna dan sering mengalami downtime 2-3 jam per minggu."
              implementation:
                priority: high
                impact: high
                change_type_ids: [1, 3]
                test_plan: "Smoke test semua endpoint API, load test dengan 100 concurrent users, uji rollback ke server lama."
                production_impact: "Aplikasi tidak dapat diakses selama 2 jam pada saat migrasi data."
                required_effort: "3 orang x 5 hari kerja"
                cost_needed: true
                cost_amount: "15000000.00"
                resources: "Cloud server 8 vCPU 16GB RAM, storage 200GB SSD, bandwidth 1Gbps"
      responses:
        "201":
          description: Package created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePackageResponse"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/changes/{id}:
    get:
      tags: [Change Package]
      summary: Show single package
      operationId: showPackage
      parameters:
        - $ref: "#/components/parameters/PackageIdPath"
      responses:
        "200":
          description: Package detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePackageResponse"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Change Package]
      summary: Update draft package (owner only, draft status)
      operationId: updatePackage
      parameters:
        - $ref: "#/components/parameters/PackageIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePackageDraftRequest"
      responses:
        "200":
          description: Package updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePackageResponse"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Change Package]
      summary: Delete draft package (owner only, soft-delete)
      operationId: deletePackage
      parameters:
        - $ref: "#/components/parameters/PackageIdPath"
      responses:
        "200":
          description: Package deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/changes/{id}/submit:
    post:
      tags: [Change Package]
      summary: Submit package for approval (owner only; persists all form fields then transitions to pending)
      operationId: submitPackage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePackageSubmitRequest"
      parameters:
        - $ref: "#/components/parameters/PackageIdPath"
      responses:
        "200":
          description: Package submitted, status pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePackageResponse"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/changes/{id}/approve:
    post:
      tags: [Change Package]
      summary: Approve package (team scope, not self, sets reviewer+responsible)
      operationId: approvePackage
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecidePackageRequest"
      parameters:
        - $ref: "#/components/parameters/PackageIdPath"
      responses:
        "200":
          description: Package approved, implementation completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePackageResponse"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/changes/{id}/reject:
    post:
      tags: [Change Package]
      summary: Reject package (team scope, not self, terminal)
      operationId: rejectPackage
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecidePackageRequest"
      parameters:
        - $ref: "#/components/parameters/PackageIdPath"
      responses:
        "200":
          description: Package rejected (terminal)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePackageResponse"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/changes/{id}/attachments:
    post:
      tags: [Change Package]
      summary: Upload attachments (draft only)
      operationId: uploadPackageAttachments
      parameters:
        - $ref: "#/components/parameters/PackageIdPath"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  maxItems: 10
      responses:
        "200":
          description: Attachments uploaded
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Lampiran berhasil diunggah." }
                  data:
                    type: array
                    items:
                      type: object
  /api/changes/{id}/pdf/initiation:
    get:
      tags: [Change Package]
      summary: Export initiation PDF (must be approved)
      operationId: exportInitiationPdf
      security:
        - bearerAuth: []
      description: |
        Exports the Formulir Inisiasi Perubahan as PDF. Only for packages with
        status `approved`. Both the initiator (Inisiator) and the reviewer
        (Disetujui Oleh) must have set their profile signature; otherwise the
        export is refused with 422 so no PDF ships with a missing signature.
      parameters:
        - $ref: "#/components/parameters/PackageIdPath"
      responses:
        "200":
          description: PDF binary
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Package not approved or a signer's signature is not set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                not-approved:
                  summary: Paket belum disetujui
                  value:
                    success: false
                    message: PDF hanya dapat di-generate untuk paket yang sudah disetujui.
                missing-signature:
                  summary: Tanda tangan belum diatur
                  value:
                    success: false
                    message: Budi belum mengatur tanda tangan. Atur tanda tangan terlebih dahulu sebelum mengekspor PDF.
  /api/changes/{id}/pdf/implementation:
    get:
      tags: [Change Package]
      summary: Export implementation PDF (package approved, impl completed)
      operationId: exportImplementationPdf
      security:
        - bearerAuth: []
      description: |
        Exports the Formulir Implementasi Perubahan as PDF. Only for packages
        where implementation status is `completed`. The three involved roles
        (Dievaluasi Oleh, Ditinjau Oleh, Penanggungjawab) must all have set
        their profile signature; otherwise the export is refused with 422.
        Unassigned roles (e.g. evaluator is nullable) are gracefully skipped.
      parameters:
        - $ref: "#/components/parameters/PackageIdPath"
      responses:
        "200":
          description: PDF binary
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Implementation not completed or a signer's signature is not set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                not-completed:
                  summary: Implementasi belum selesai
                  value:
                    success: false
                    message: PDF hanya dapat di-generate untuk implementasi yang sudah selesai (diterima).
                missing-signature:
                  summary: Tanda tangan belum diatur
                  value:
                    success: false
                    message: Andi belum mengatur tanda tangan. Atur tanda tangan terlebih dahulu sebelum mengekspor PDF.
