        data:
          type: array
          items:
            $ref: "#/components/schemas/RoleResource"
      example:
        success: true
        data:
          - id: 1
            name: admin
            permissions: [user.manage, role.manage, permission.manage, wfh.report.create]
          - id: 2
            name: kepala_bidang
            permissions: [wfh.report.approve, wfh.report.reject, wfh.monitoring.view]
          - id: 3
            name: kepala_tim
            permissions: [change.initiation.approve, change.implementation.review]
          - id: 4
            name: staf
            permissions: [wfh.report.create, wfh.report.submit, change.initiation.create]
