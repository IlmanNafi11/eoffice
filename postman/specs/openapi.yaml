              start_time: "08:00"
              end_time: "10:00"
              links:
                - url: "https://git.kominfo.go.id/intern/wfh-api/-/merge_requests/12"
      responses:
        "201":
          description: Activity created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportActivityResponse"
              example:
                success: true
                message: Kegiatan berhasil ditambahkan.
                data:
                  id: 67
                  activity: "Mengikuti pelatihan diklat Kominfo"
                  start_time: "08:00"
                  end_time: "10:00"
                  sort_order: 1
                  links:
                    - id: 89
                      url: "https://git.kominfo.go.id/intern/wfh-api/-/merge_requests/12"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Unauthenticated.
        "403":
          description: Not the report owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
