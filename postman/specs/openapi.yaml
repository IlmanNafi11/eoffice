                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Laporan dikembalikan ke draft untuk revisi.
                  data:
                    $ref: "#/components/schemas/WfhReportResource"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Unauthenticated.
        "403":
          description: Not the report owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: This action is unauthorized.
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Laporan tidak ditemukan.
        "422":
          description: Invalid state transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: "Laporan dengan status draft tidak dapat direvisi."
  /api/wfh/reports/{report}/activities:
    post:
      tags: [WFH Reports]
      summary: Append an activity to a draft/rejected report
      operationId: addReportActivity
      description: |
        v6.0.0 sub-resource: appends one activity (with optional inline links)
