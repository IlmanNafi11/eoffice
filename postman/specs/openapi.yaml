    put:
      tags: [RBAC Management]
      summary: Sync permissions for a role
      operationId: updateRolePermissions
      security:
        - bearerAuth: []
      description: |
        Replaces the full set of permissions for a role.
        Protected roles (admin) cannot lose critical permissions
        (role.manage, permission.manage, user.manage) — prevents system lockout.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Role ID
          example: 4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRolePermissionsRequest"
      responses:
        "200":
          description: Permissions updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Permission untuk role berhasil diperbarui.
                  data:
                    $ref: "#/components/schemas/RoleResource"
        "403":
          description: Missing role.manage permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Role not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Role tidak ditemukan.
        "422":
          description: Validation error or protected role lockout prevention
          content:
