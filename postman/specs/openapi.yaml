    # ── WFH Reports ─────────────────────────────────────────────────
    StoreReportRequest:
      type: object
      description: |
        WFH report create payload (POST only). Sent as `multipart/form-data`
        when attendance photos are uploaded. v6.0.0: PUT no longer uses this
        schema — `PUT /api/wfh/reports/{report}` is metadata-only. The
        content-required-on-submit guard moved DB-side to the submit endpoint.
      required: [report_date]
      properties:
        report_date:
          type: string
          format: date
          example: "2025-07-11"
        status:
          type: string
          enum: [draft, submit]
          default: draft
          description: 'POST create only. "draft" (default) persists a partial report; "submit" transitions to pending — content guard runs DB-side at the submit endpoint.'
          example: draft
        activities:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ReportActivityInput"
        attendances:
          type: object
          nullable: true
          description: |
            Optional attendance photo uploads, keyed by session. Each session
            is independent; provide any subset of pagi/siang/sore. Requires a
            multipart/form-data request body.
          properties:
            pagi:
              type: object
              properties:
                photo:
                  type: string
                  format: binary
            siang:
              type: object
              properties:
                photo:
                  type: string
                  format: binary
            sore:
              type: object
              properties:
                photo:
                  type: string
                  format: binary
      example:
        report_date: "2025-07-11"
        status: submit
        activities:
          - start_time: "08:00"
            end_time: "10:00"
            activity: "Menyusun dokumentasi API modul WFH"
            links:
              - https://git.kominfo.go.id/intern/wfh-api/-/merge_requests/12
          - start_time: "10:00"
            end_time: "12:00"
            activity: "Review kode fitur change management"
          - start_time: "13:00"
            end_time: "15:30"
            activity: "Perbaikan bug validasi tanggal absensi"
            links:
              - https://git.kominfo.go.id/intern/wfh-api/-/issues/34
    ReportActivityInput:
      type: object
      required: [activity]
      properties:
        start_time:
          type: string
          pattern: '^\d{2}:\d{2}$'
          example: "08:00"
        end_time:
          type: string
          pattern: '^\d{2}:\d{2}$'
          example: "10:00"
        activity:
          type: string
          example: "Menyusun dokumentasi API modul WFH"
        links:
          type: array
          nullable: true
          items:
            type: string
            format: uri
          example:
            - https://git.kominfo.go.id/intern/wfh-api/-/merge_requests/12
      example:
        start_time: "08:00"
        end_time: "10:00"
        activity: "Menyusun dokumentasi API modul WFH"
        links:
          - https://git.kominfo.go.id/intern/wfh-api/-/merge_requests/12
    StoreActivityRequest:
      type: object
      required: [activity]
      description: |
        Payload for the POST/PUT activity sub-resource (v6.0.0). Links are an
        array of `{id?, url}`; PUT applies them as an id-diff (matched ids kept,
        new entries created, missing ids deleted).
      properties:
        activity:
          type: string
          example: "Mengikuti pelatihan diklat Kominfo"
        start_time:
          type: string
          pattern: '^\d{2}:\d{2}$'
          nullable: true
          example: "08:00"
        end_time:
          type: string
          pattern: '^\d{2}:\d{2}$'
          nullable: true
          description: Must be after start_time.
          example: "10:00"
        id:
          type: integer
          nullable: true
          description: Optional; only meaningful inside PUT link id-diff payloads.
        links:
          type: array
          nullable: true
          items:
            type: object
            required: [url]
            properties:
              id:
                type: integer
                nullable: true
              url:
                type: string
                format: uri
      example:
        activity: "Menyusun dokumentasi API modul WFH"
        start_time: "08:00"
        end_time: "10:00"
        links:
          - url: "https://git.kominfo.go.id/intern/wfh-api/-/merge_requests/12"
    AppendAttendanceRequest:
      type: object
      required: [photo, session]
      description: |
        Multipart payload for the POST attendance sub-resource (v6.0.0).
        `session` must be in the `wfh_sessions` Setting (default pagi/siang/sore).
      properties:
        photo:
          type: string
          format: binary
          description: JPG/JPEG/PNG, max 2MB.
        session:
          type: string
          enum: [pagi, siang, sore]
          example: pagi
      example:
        session: pagi
        photo: <binary file upload>
