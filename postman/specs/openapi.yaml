          example: 2
        name:
          type: string
          example: kepala_bidang
        permissions:
          type: array
          items:
            type: string
          example: [wfh.report.approve, wfh.report.reject, wfh.monitoring.view]
      example:
        id: 2
        name: kepala_bidang
        permissions: [wfh.report.approve, wfh.report.reject, wfh.monitoring.view, wfh.report.export_pdf]
    PermissionResource:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          example: 7
        name:
          type: string
          example: wfh.report.approve
      example:
        id: 7
        name: wfh.report.approve
    UpdateRolePermissionsRequest:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          items:
            type: string
          description: |
            Full list of permission names to sync to this role.
            Protected roles (admin) cannot lose critical permissions (role.manage, permission.manage, user.manage).
          example: [wfh.report.create, wfh.report.submit, wfh.report.export_pdf]
      example:
        permissions: [wfh.report.create, wfh.report.submit, wfh.report.export_pdf]
    RoleListResponse:
