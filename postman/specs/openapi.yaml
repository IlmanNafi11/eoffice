                  type: array
                  items:
                    type: integer
            example:
              ids: [69, 67, 68]
      responses:
        "200":
          description: Order applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                message: "Urutan kegiatan berhasil diubah."
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Unauthenticated.
        "403":
          description: Not the report owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: "Tidak dapat mengubah laporan orang lain."
        "422":
          description: id set mismatch or report not editable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: "Id kegiatan tidak sesuai dengan laporan ini."
  /api/wfh/reports/{report}/attendances:
    post:
      tags: [WFH Reports]
      summary: Append an attendance (session photo) to a report
      operationId: addReportAttendance
      description: |
        v6.0.0 sub-resource replacing `POST /wfh/attendance`. Multipart upload
        of one session photo, scoped to the parent report. Guards: report must
        be `draft`/`rejected` (422); `report_date` must be today (422); today
        must be an allowed WFH day (422); no duplicate `(user,date,session)`
        (422); actor must own the report (403). Requires `wfh.report.create`.
      parameters:
        - $ref: "#/components/parameters/ReportIdPath"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AppendAttendanceRequest"
            example:
              session: pagi
              photo: <binary file upload>
      responses:
        "201":
          description: Attendance recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceResponse"
              example:
                success: true
                message: Absensi WFH berhasil.
                data:
                  id: 45
                  date: "2025-07-11"
                  session: pagi
                  photo_url: http://localhost/storage/attendances/1/2025-07-11/photo.jpg
                  check_in_at: "2025-07-11T08:15:30.000000Z"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Unauthenticated.
        "403":
          description: Not the report owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: "Tidak dapat mengubah laporan orang lain."
        "422":
          description: Wrong day, backdated report_date, duplicate session, or report not editable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: "Anda sudah melakukan absensi untuk sesi ini."
  /api/wfh/reports/{report}/attendances/{attendance}:
    delete:
      tags: [WFH Reports]
      summary: Delete an attendance row from a report
      operationId: deleteReportAttendance
